name: "Build glibc (znver4 · SDE)"

on:
  workflow_dispatch:
    inputs:
      fedora_release:
        description: "Fedora release version"
        default: "44"
        type: string
      sde_version:
        description: "Version of Intel SDE to use"
        default: "10.13.1-2026-07-28"
        type: string

permissions:
  contents: write

jobs:
  build-glibc:
    runs-on: ubuntu-latest
    container:
      image: fedora:${{ inputs.fedora_release || '44' }}
      options: --privileged
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dependencies and Intel SDE
        run: |
          dnf install -y tar xz curl git createrepo_c

          SDE_VERSION="${{ inputs.sde_version || '10.13.1-2026-07-28' }}"
          echo "Using SDE ${SDE_VERSION}"
          URL="https://downloadmirror.intel.com/924984/sde-external-${SDE_VERSION}-lin.tar.xz"

          mkdir -p /opt/sde
          curl -vfL "$URL" | tar -xJ -C /opt/sde --strip-components=1

      - name: Build glibc with znver4 wrapped in SDE
        run: |
          chmod +x ~/scripts/patch-glibc-spec.sh ~/scripts/vm-build-glibc.sh
          /opt/sde/sde64 -spr -- bash scripts/vm-build-glibc.sh scripts/patch-glibc-spec.sh

      - name: Upload glibc RPMs
        uses: actions/upload-artifact@v4
        with:
          name: glibc-znver4-rpms
          path: /output/*.rpm
          if-no-files-found: ignore

      - name: Deploy RPMs to repository
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

          mkdir -p x86_64
          cp -f /output/*.rpm x86_64/ 2>/dev/null || true
          touch .nojekyll

          createrepo_c x86_64/

          git add .nojekyll x86_64/
          if ! git diff-index --quiet HEAD; then
            git commit -m "build: update glibc znver4 rpms and repository metadata"
            git push
          fi

